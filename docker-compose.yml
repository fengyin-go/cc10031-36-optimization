services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      # 指标水位库落在持久卷，容器重建后处理水位与纳入版本不丢失
      - METRICS_DB=/data/metric_watermark.sqlite3
    volumes:
      - metric-data:/data
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  metric-data:
